[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-kit"
version = "0.2.0"
description = "Mock-environment Agent runner and outcome evaluator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=2,<3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.35",
  "python-multipart>=0.0.20,<0.1",
]

[project.scripts]
agent-eval = "scripts.agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "scripts.agent_eval*"]

[tool.setuptools.package-data]
"scripts.agent_eval.web" = ["static/*.html", "static/*.css", "static/*.js"]
